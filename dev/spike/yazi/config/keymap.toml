[[mgr.prepend_keymap]]
on = "1"
run = "plugin hello spawn"
desc = "probe: Command:spawn()"

[[mgr.prepend_keymap]]
on = "2"
run = "plugin hello status"
desc = "probe: Command:status()"

[[mgr.prepend_keymap]]
on = "3"
run = "plugin hello output"
desc = "probe: Command:output()"

[[mgr.prepend_keymap]]
on = "4"
run = "plugin hello daemon"
desc = "probe: long-lived spawn"

[[mgr.prepend_keymap]]
on = "5"
run = "plugin hello held"
desc = "probe: long-lived spawn, handle held in a global"

[[mgr.prepend_keymap]]
on = "6"
run = "plugin hello detach"
desc = "probe: double-forked child"

[[mgr.prepend_keymap]]
on = "7"
run = "plugin hello env"
desc = "probe: env inherited by children"

[[mgr.prepend_keymap]]
on = "8"
run = "plugin probe"
desc = "probe: read cx state"

[[mgr.prepend_keymap]]
on = "9"
run = "plugin probe pub"
desc = "probe: publish cx state to ya sub"

[[mgr.prepend_keymap]]
on = "0"
run = "arrow 2"
desc = "probe: canary proving keymap.toml loaded"
