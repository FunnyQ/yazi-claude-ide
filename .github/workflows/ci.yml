name: CI

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Verify binary architecture
        run: |
          file target/aarch64-apple-darwin/release/yazi-claude-ide
          lipo -archs target/aarch64-apple-darwin/release/yazi-claude-ide | grep -q arm64

      - name: Package release binary
        run: |
          tar -czf yazi-claude-ide-aarch64-apple-darwin.tar.gz \
            -C target/aarch64-apple-darwin/release yazi-claude-ide

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: yazi-claude-ide-aarch64-apple-darwin.tar.gz
