name: CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            file_match: "Mach-O 64-bit executable arm64"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            file_match: "ELF 64-bit LSB .*x86-64.*static"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            file_match: "ELF 64-bit LSB .*ARM aarch64.*static"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary architecture
        env:
          FILE_MATCH: ${{ matrix.file_match }}
        run: |
          bin=target/${{ matrix.target }}/release/yazi-claude-ide
          file "$bin"
          file "$bin" | grep -Eq "$FILE_MATCH"

      - name: Package release binary
        run: |
          tar -czf yazi-claude-ide-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release yazi-claude-ide

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: yazi-claude-ide-${{ matrix.target }}
          path: yazi-claude-ide-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yazi-claude-ide-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: yazi-claude-ide-*.tar.gz
